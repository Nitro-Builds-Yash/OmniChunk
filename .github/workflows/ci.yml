name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # No provider probe reaches the network, and no paid call can be made.
      CLEAVE_LLM: none
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: cache models (Docling, RapidOCR, MiniLM, tiktoken)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
            ~/.cache/tiktoken
            .venv/lib/python3.12/site-packages/rapidocr/models
          key: models-${{ hashFiles('uv.lock') }}
      - name: lint
        run: uv run ruff check .
      - name: typecheck
        run: uv run mypy
      - name: test
        # Docling downloads CV models on the first PDF, so this job is minutes,
        # not seconds. Mocking the parse would weaken the suite's whole point.
        run: uv run pytest -q --cov=cleave --cov-report=term-missing
        env:
          TIKTOKEN_CACHE_DIR: /home/runner/.cache/tiktoken
      - name: retrieval benchmark
        run: uv run cleave eval-retrieval benchmarks/qa_fixtures.jsonl -o retrieval_scorecard.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-scorecard
          path: retrieval_scorecard.json

  rust:
    runs-on: ubuntu-latest
    env:
      CLEAVE_LLM: none
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/cleave_core
      - name: fmt
        run: cargo fmt --manifest-path rust/cleave_core/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path rust/cleave_core/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path rust/cleave_core/Cargo.toml --no-default-features
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: build extension
        run: uv run maturin develop -r -m rust/cleave_core/Cargo.toml
      - name: parity + full fast suite on the Rust backend
        run: uv run pytest -q -m "not slow" tests/
      - name: speed benchmark
        run: uv run python benchmarks/bench_text_engine.py 5000
