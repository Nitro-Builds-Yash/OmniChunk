[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "cleave-core"
version = "0.1.0"
description = "Rust acceleration for Cleave (optional; pure-Python fallbacks exist)"
requires-python = ">=3.12"

[tool.maturin]
features = ["python"]
module-name = "cleave_core"
